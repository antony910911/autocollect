researcher_profile: |
  台灣研發人員，聚焦共消化、沼氣增量、乾式厭氧醱酵、現地操作預警與智慧控制。
  研究可取得產氣量與組成、VFA（乙酸/丙酸/丁酸）、鹼度、FOS/TAC、TAN/FAN、TS、OLR 等資料。
  特別關注沼渣生物炭循環利用、淋灑策略、料源篩選及現地驗證。
