# 生質能週報資料來源設定
# 修改這個檔案即可增減關鍵字與來源，不需要改程式。

# 你的背景：會用來讓「新題目建議」更貼近你能落地的方向。請改成你的實際狀況。
researcher_profile: |
  單位：工研院綠能與環境研究所（研究機構，負責技術開發與產業技術移轉）。
  專長與設備：
  - 厭氧醱酵與乾式厭氧醱酵（具乾式厭氧醱酵設備）
  - 廢水處理
  - 生質燃料、生質燃油；法尼烯（farnesene）生產
  - 基因改質酵母菌、分子生物、微生物技術（合成生物學、菌株開發）
  - PHA／PHB 等生物可分解塑膠的微生物生產
  - 化學分析
  目標產業客戶：沼氣中心、養豬場、酒廠、化妝品業、可分解生物塑膠包材業者。
  可用原料：農業廢棄物、禽畜糞、廚餘、林業資材、藻類，以及微生物、酵母菌、細菌（菌種資源）。
  題目偏好：能結合既有設備與菌株平台、可與上述客戶做先導驗證或技術移轉的方向；
  例如把酒廠副產物、禽畜糞、farnesene 衍生物、PHA 等廢棄物轉成高附加價值產品。

# 新聞往回抓幾天；論文因為索引有延遲，往回抓久一點，靠歷史紀錄去重。
news_lookback_days: 7
papers_lookback_days: 21

# 送進分析的資料上限（避免單週資料過多）
max_items_for_analysis: 320

# Google News 搜尋（不需金鑰）。每組 query 會分別抓取。
google_news:
  - lang: zh-TW
    hl: zh-TW
    gl: TW
    ceid: "TW:zh-Hant"
    max_per_query: 20
    queries:
      - 生質能
      - 生質能源 發電
      - 生質燃料
      - 永續航空燃料 SAF
      - 沼氣 發電
      - 生質甲烷
      - 生物炭 碳匯
      - 生質柴油
      - 生質酒精 纖維素
      - 農業廢棄物 再利用 能源
      - 廚餘 厭氧消化
      - 生質 碳捕捉 BECCS
      - 能源署 生質
      - 乾式厭氧醱酵
      - 養豬場 沼氣
      - 酒糟 再利用
      - 生物可分解塑膠 PHA
      - 合成生物學 酵母菌
      - 工研院 生質
  - lang: en
    hl: en-US
    gl: US
    ceid: "US:en"
    max_per_query: 15
    queries:
      - bioenergy
      - biomass power plant
      - sustainable aviation fuel
      - renewable diesel HVO
      - biomethane OR "renewable natural gas"
      - biogas anaerobic digestion
      - biochar carbon removal
      - BECCS
      - bio-methanol OR "biomethanol"
      - cellulosic ethanol
      - pyrolysis bio-oil
      - hydrothermal liquefaction
      - biomass gasification hydrogen
      - alcohol-to-jet
      - biorefinery
      - dry anaerobic digestion
      - polyhydroxyalkanoates PHA
      - farnesene
      - precision fermentation
      - synthetic biology yeast biomanufacturing
      - biogas to bioplastics OR "methane to PHA"
      - distillery waste valorization
      - bio-based cosmetic ingredients squalane
  # 產業媒體：用 Google News 依網站搜尋，作為 RSS 失效時的備援
  - lang: en
    hl: en-US
    gl: US
    ceid: "US:en"
    max_per_query: 15
    queries:
      - site:biomassmagazine.com
      - site:biofuelsdigest.com
      - site:bioenergy-news.com
      - site:greencarcongress.com biofuel OR biogas OR bioplastic
      - site:bioplasticsnews.com OR site:european-bioplastics.org
  - lang: ja
    hl: ja
    gl: JP
    ceid: "JP:ja"
    max_per_query: 10
    queries:
      - バイオマス発電
      - 持続可能な航空燃料
      - バイオガス

# 產業媒體與國際組織 RSS
rss_feeds:
  - name: Bioenergy International
    url: https://www.bioenergyinternational.com/feed/
  - name: Biofuels Digest
    url: https://www.biofuelsdigest.com/bdigest/feed/
  - name: IEA Bioenergy
    url: https://www.ieabioenergy.com/feed/
  - name: European Biogas Association
    url: https://www.europeanbiogas.eu/feed/
  - name: Bioenergy Insight
    url: https://www.bioenergy-news.com/feed/

# OpenAlex 學術論文。mailto 可用環境變數 OPENALEX_MAILTO 設定；
# 若有 OpenAlex API key，設成環境變數 OPENALEX_API_KEY（GitHub Secret）可避免 429 請求過多。
# OpenAlex 失敗時會自動改用 Crossref 查同一組關鍵字。
openalex:
  mailto: ""
  max_per_query: 25
  queries:
    - biomass gasification
    - biomass pyrolysis
    - hydrothermal liquefaction biomass
    - sustainable aviation fuel
    - anaerobic digestion biogas
    - biomethane upgrading
    - biochar
    - bioenergy carbon capture storage
    - lignocellulosic biorefinery
    - bio-oil upgrading catalyst
    - microalgae biofuel
    - torrefaction biomass
    - dry anaerobic digestion solid-state
    - polyhydroxyalkanoates production waste feedstock
    - polyhydroxybutyrate mixed microbial culture
    - farnesene Saccharomyces cerevisiae
    - engineered yeast terpene production
    - swine manure anaerobic digestion
    - distillery stillage valorization
    - methanotroph PHB biogas
    - volatile fatty acids anaerobic fermentation
