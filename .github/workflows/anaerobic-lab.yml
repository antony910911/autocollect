name: 厭氧消化研究快報全自動

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anaerobic-lab-auto
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      FOLIO_SYNC_TOKEN: ${{ secrets.FOLIO_SYNC_TOKEN }}
      FOLIO_URL: ${{ vars.FOLIO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 檢查必要密鑰
        run: |
          test -n "$FOLIO_SYNC_TOKEN" || { echo "::error::Missing FOLIO_SYNC_TOKEN"; exit 1; }
      - name: 驗證 ChatGPT 已提交研究快報
        run: |
          week="$(TZ=Asia/Taipei date +%G-W%V)"
          test -s "reports/anaerobic_lab/$week.md" || { echo "::error::ChatGPT report not yet committed"; exit 1; }
          grep -q '## 二、精選研究與技術報告' "reports/anaerobic_lab/$week.md" || { echo "::error::Report analysis missing"; exit 1; }
      - name: 同步到 Folio
        run: |
          week="$(TZ=Asia/Taipei date +%G-W%V)"
          python -m autocollect folio --topic anaerobic_lab --week "$week"
