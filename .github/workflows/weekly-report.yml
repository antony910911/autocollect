name: 生質能週報資料收集

on:
  schedule:
    # 每週一 06:47（台北時間）= 週日 22:47 UTC
    - cron: "47 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 只收集資料（免費）；分析由 Claude Code 每週排程任務讀取 data/packs/ 後完成。
      # 若改用 Anthropic API 一次完成，把下面的指令換成 `python -m autocollect run`
      # 並在 env 加上 ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 收集資料
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TZ: Asia/Taipei
        run: |
          python -m autocollect collect
          python -m autocollect build   # 先產生「資料整理版」報告，分析完成後會被覆蓋

      - name: 提交資料
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "沒有新的變更"
          else
            git commit -m "週報資料 $(TZ=Asia/Taipei date +%G-W%V)"
            # 執行期間 main 可能有新的提交（例如程式更新），先接上再推送
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
