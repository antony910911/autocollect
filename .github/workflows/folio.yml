name: 週報同步到 Folio

on:
  push:
    branches: [main]
    paths:
      - "data/analysis/**"
      - "data/*/analysis/**"
      # ChatGPT 每週五發表的工程酵母／萜類研究快報
      - "reports/farnesene_lab/*.md"
      - "reports/proposal_radar/*.md"
  schedule:
    # 保險：每週一 14:07（台北時間）再同步一次最新一期（重複上傳不會產生重複頁面）
    - cron: "7 6 * * 1"
    # 週五 20:45（台北時間）備援：即使 push 觸發失敗仍會再嘗試同步
    - cron: "45 12 * * 5"
  workflow_dispatch:
    inputs:
      topic:
        description: "主題（bioenergy、farnesene、farnesene_lab、proposal_radar），留空為全部主題的最新一期"
        required: false
      week:
        description: "週次（例如 2026-W41），留空為最新一期；需同時指定主題"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 可辨識本次 push 修改的週報，不會誤上傳未來週次的測試頁

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 上傳到 Folio
        env:
          FOLIO_SYNC_TOKEN: ${{ secrets.FOLIO_SYNC_TOKEN }}
          FOLIO_URL: ${{ vars.FOLIO_URL }}
          TOPICS: bioenergy farnesene farnesene_lab proposal_radar
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          # tutorial：發布 tutorial/ 的教材章節（只能手動觸發）
          if [ "$INPUT_TOPIC" = "tutorial" ]; then
            python tutorial/publish_to_folio.py
            exit $?
          fi
          if [ -n "$INPUT_TOPIC" ] && [ -n "$INPUT_WEEK" ]; then
            python -m autocollect folio --topic "$INPUT_TOPIC" --week "$INPUT_WEEK"
            exit $?
          fi
          status=0
          # 當次 push 若包含研究快報，就同步精確週次，避免下週測試頁被選為「最新」
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            changed_lab="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^reports/farnesene_lab/[0-9]{4}-W[0-9]{2}\.md$' || true)"
            if [ -n "$changed_lab" ]; then
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                week="$(basename "$file" .md)"
                echo "本次更新週次：$week"
                python -m autocollect folio --topic farnesene_lab --week "$week" || status=1
              done <<< "$changed_lab"
              TOPICS="bioenergy farnesene proposal_radar"
            fi
          fi
          for t in ${INPUT_TOPIC:-$TOPICS}; do
            python -m autocollect folio --topic "$t" || status=1
          done
          exit $status
